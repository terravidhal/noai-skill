name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Structure, links, assets and scanner evals
        run: npm run lint

      - name: Full deterministic evals
        run: npm run lint:evals
